<body>

    <div id="erro-carregamento">A carregar o álbum e o banco de dados mestre...</div>

    <div class="top-controls">
        <button id="btn-abrir-pacote" class="control-btn">🎁 Abrir Pacotinho</button>
        <button id="btn-fullscreen" class="control-btn">Tela Cheia (F11)</button>
        <button id="btn-toggle-carteira" class="control-btn">Minha Carteira</button>
    </div>

    <div id="gaveta-carteira">

            <div class="carteira-header"><h2>Carteira de Cards</h2><button class="btn-fechar-gaveta" id="btn-fechar-gaveta">×</button></div>
            
            <div class="painel-recursos">
                <div class="fcm-estoque-contador tickets">Tickets Ganhos<span id="lbl-tickets-estoque">5</span></div>

            </div>
            <button id="btn-gastar-ticket">🎰 Trocar 1 Ticket por Pacote</button>
            <button id="btn-importar-carreira">🎮 Importar Save da Carreira</button>

                </div>

        </div>

    <div id="fcm-zoom-overlay">

    <script>

        // =====================================================================
        let figurinhaIdGlobal = 1; 
        const mapeamentoSlots = {}; 
        const bancoMestreJogadores = {}; 
        let pageFlip = null; 
        let paginaSerieA = 1; 
        let paginaSerieB = 41; 
        let abaAtiva = "disponiveis";
        let cardSelecionadoParaExcluir = null; 
        
        const poolNormais = [];

        function acharEscudoTratado(nomeTime) {
            let alvo = clubes.find(c => c.nome.toLowerCase().trim() === nomeTime.toLowerCase().trim());
            return alvo ? alvo.img : "";
        }

        function verificarAssinaturaCupom(textoInvisivel, hashInformado) {
            let textoTratado = textoInvisivel.toLowerCase().trim();
            let somaToken = 0;
            for (let i = 0; i < textoTratado.length; i++) {
                somaToken += textoTratado.charCodeAt(i) * (i + 1);
            }
            let hashCalculado = String((somaToken * 37) % 8999 + 1000);
            return hashCalculado === hashInformado;
        }

        // Motor criptográfico unificado em string estruturada para assinar os tokens em lote
        function gerarHashTokenTrocaLote(listaDarStr, listaQueroStr, salt) {
            let stringBase = `${listaDarStr}-${listaQueroStr}-${salt}-SIGALAPELOTAFCM26`;
            let hash = 0;
            for (let i = 0; i < stringBase.length; i++) {
                hash = (hash << 5) - hash + stringBase.charCodeAt(i);
                hash |= 0;
            }
            return String(Math.abs(hash) % 899999 + 100000);
        }

                let txtDou = document.getElementById('txt-card-eu-dou').value.trim();
                let txtQuero = document.getElementById('txt-card-eu-quero').value.trim();

                if(!txtDou || !txtQuero) { alert("Por favor, preencha os números das cartas separando-os por vírgula!"); return; }

                let slotsDou = txtDou.split(',').map(x => x.trim().padStart(3, '0')).filter(x => x.length > 0);
                let slotsQuero = txtQuero.split(',').map(x => x.trim().padStart(3, '0')).filter(x => x.length > 0);

                if(slotsDou.length === 0 || slotsQuero.length === 0) { alert("Nenhum número de carta válido detectado!"); return; }

                let idsDou = [];
                let idsQuero = [];

                for(let s of slotsDou) {
                    let id = obterIdJogadorPorNumeroSlot(s);
                    if(!id) { alert(`Figurinha Nº ${s} não foi localizada no banco de dados!`); return; }
                    idsDou.push(id);
                }
                for(let s of slotsQuero) {
                    let id = obterIdJogadorPorNumeroSlot(s);
                    if(!id) { alert(`Figurinha Nº ${s} não foi localizada no banco de dados!`); return; }
                    idsQuero.push(id);
                }

                let estoqueRepetidas = fcmSaveData.repetidas.map(x => parseInt(x));
                for(let id of idsDou) {
                    if(!estoqueRepetidas.includes(id)) {
                        alert(`Você não possui a figurinha Nº ${obterNumeroSlotPorId(id)} (${bancoMestreJogadores[id].nome}) nas suas repetidas!`);
                        return;
                    }
                }

                // CUSTÓDIA LÓGICA LOCAL: Dá baixa imediata nas repetidas do Colecionador A
                idsDou.forEach(id => {
                    let idx = fcmSaveData.repetidas.indexOf(id);
                    if(idx > -1) fcmSaveData.repetidas.splice(idx, 1);
                });

                // 🧠 SINCRO-BLINDAGEM CORRIGIDA: Ordena rigidamente de forma crescente antes de gerar o Token
                let strIdsDou = [...idsDou].sort((a,b)=>a-b).join(',');
                let strIdsQuero = [...idsQuero].sort((a,b)=>a-b).join(',');

                let hashAssinatura = gerarHashTokenTrocaLote(strIdsDou, strIdsQuero, "LOTE");
                let tokenFinal = `FCM-OUTLOTE-[${strIdsDou}]-[${strIdsQuero}]-${hashAssinatura}`;

                document.getElementById('lbl-token-resultado').value = tokenFinal;
                salvarProgressoAutomatico();
                atualizarInterfaceCarteira();

                alert(`🔒 CÓDIGO EM LOTE GERADO!\n\nAs cartas oferecidas saíram das suas repetidas e estão sob custódia do Token. Envie o código verde para o seu amigo.`);
            });

            // PASSO 2: Processamento unificado blindado contra inversão de chaves e com ordenação fixa
            document.getElementById('btn-processar-token-p2p').addEventListener('click', () => {
                let tokenBruto = document.getElementById('txt-token-parceiro-ler').value.trim().toUpperCase();
                if(!tokenBruto) { alert("Cole o código do seu parceiro antes de processar!"); return; }

                let partes = tokenBruto.split("-");
                if(partes.length !== 5 || partes[0] !== "FCM") { alert("Formato de código inválido!"); return; }

                let acao = partes[1]; // OUTLOTE ou INLOTE
                let strIdsA = partes[2].replace(/[\[\]]/g, ""); 
                let strIdsB = partes[3].replace(/[\[\]]/g, ""); 
                let hashInformado = partes[4];

                // 🧠 SINCRO-BLINDAGEM NO RECEBIMENTO: Os IDs precisam estar rigidamente ordenados para bater com a fórmula do Hash
                let hashCalculado = gerarHashTokenTrocaLote(strIdsA, strIdsB, "LOTE");
                if(hashCalculado !== hashInformado) { alert("❌ FALHA DE INTEGRIDADE: Código inválido ou violado!"); return; }

                let idsA = strIdsA.split(',').map(x => parseInt(x)).filter(x => !isNaN(x));
                let idsB = strIdsB.split(',').map(x => parseInt(x)).filter(x => !isNaN(x));

                if(acao === "OUTLOTE") {
                    let entradaTrava = prompt(`🤝 DESAFIO ANTIFRAUDE P2P\n\nSeu amigo enviou uma proposta em lote.\nPara validar a transação, digite os Números das figurinhas que VOCÊ combinou de enviar a ele (separe-os por vírgula):`);
                    
                    if(!entradaTrava) { alert("Operação cancelada pelo usuário."); return; }

                    let slotsDigitadosTrava = entradaTrava.split(',').map(x => x.trim().padStart(3, '0')).filter(x => x.length > 0);
                    let idsDigitadosTrava = [];

                    for(let s of slotsDigitadosTrava) {
                        let id = obterIdJogadorPorNumeroSlot(s);
                        if(!id) { alert(`Figurinha Nº ${s} digitada na trava não existe.`); return; }
                        idsDigitadosTrava.push(id);
                    }

                    let ordenadoB = [...idsB].sort((a,b)=>a-b);
                    let ordenadoDigitado = [...idsDigitadosTrava].sort((a,b)=>a-b);

                    if(ordenadoB.join(',') !== ordenadoDigitado.join(',')) {
                        alert("❌ FRAUDE OU ERRO DETECTADO!\n\nOs números que você digitou não correspondem às cartas combinadas no contrato. A troca foi abortada.");
                        return;
                    }

                    let estoqueRepetidasB = fcmSaveData.repetidas.map(x => parseInt(x));
                    let copiaEstoque = [...estoqueRepetidasB];
                    let possuiTudo = true;

                    for(let id of idsB) {
                        let idx = copiaEstoque.indexOf(id);
                        if(idx > -1) { copiaEstoque.splice(idx, 1); } else { possuiTudo = false; }
                    }

                    if(!possuiTudo) {
                        alert("❌ OPERAÇÃO RECUSADA!\n\nVocê digitou os números certos, mas não possui essas figurinhas repetidas suficientes em seu inventário real.");
                        return;
                    }

                    idsB.forEach(id => {
                        let idx = fcmSaveData.repetidas.indexOf(id);
                        if(idx > -1) fcmSaveData.repetidas.splice(idx, 1);
                    });

                    idsA.forEach(id => { fcmSaveData.disponiveis.push(id); });

                    // Mantém a ordem idêntica à do envio para o Hash bater perfeitamente no Proponente
                    let hashRetorno = gerarHashTokenTrocaLote(strIdsA, strIdsB, "LOTE");
                    let tokenRetorno = `FCM-INLOTE-[${strIdsA}]-[${strIdsB}]-${hashRetorno}`;

                    document.getElementById('lbl-token-resultado').value = tokenRetorno;
                    document.getElementById('txt-token-parceiro-ler').value = "";

                    salvarProgressoAutomatico();
                    atualizarInterfaceCarteira();

                    alert(`🎉 SUCESSO!\n\nAs cartas entraram nas suas Disponíveis. Copie o novo código de confirmação no campo verde e envie de volta para o Colecionador A finalizar a parte dele.`);

                } else if(acao === "INLOTE") {
                    if(fcmSaveData.disponiveis.includes(idsB[0]) || fcmSaveData.colados[idsB[0]]) {
                        alert("Este contrato de troca em lote já foi liquidado anteriormente no seu sistema.");
                        return;
                    }

                    // O Proponente (A) recebe as cartas do lote B
                    idsB.forEach(id => { fcmSaveData.disponiveis.push(id); });

                    document.getElementById('lbl-token-resultado').value = "";
                    document.getElementById('txt-token-parceiro-ler').value = "";
                    document.getElementById('txt-card-eu-dou').value = "";
                    document.getElementById('txt-card-eu-quero').value = "";

                    salvarProgressoAutomatico();
                    atualizarInterfaceCarteira();

                    alert(`🎉 TROCA EM LOTE TOTALMENTE CONCLUÍDA!\n\nSeu lote de propostas foi liquidado com sucesso. Novas figurinhas prontas para o álbum!`);
                }
            });

            document.getElementById('btn-gastar-ticket').addEventListener('click', () => {
                if (fcmSaveData.tickets <= 0) return;
                fcmSaveData.tickets--; fcmSaveData.pacotes++;
                salvarProgressoAutomatico(); atualizarInterfaceCarteira();
            });

            document.getElementById('btn-importar-carreira').addEventListener('click', () => { document.getElementById('file-uploader-carreira').click(); });
            document.getElementById('file-uploader-carreira').addEventListener('change', function(e) {
                let arquivoEscolhido = e.target.files[0]; if (!arquivoEscolhido) return;
                let assinaturaUnicaDoArquivo = `${arquivoEscolhido.name}_${arquivoEscolhido.size}_${arquivoEscolhido.lastModified}`;
                if (fcmSaveData.historicoSavesProcessados.includes(assinaturaUnicaDoArquivo)) { alert("⚽ Seu progresso já está atualizado!"); return; }

                let reader = new FileReader();
                reader.onload = function(event) {
                    let conteudoTexto = event.target.result;
                    if (!conteudoTexto.includes("FBCHUNKS") && !conteudoTexto.includes("SaveType_Career")) { alert("❌ Arquivo inválido!"); return; }
                    let creditosGanhos = Math.floor(Math.random() * 3) + 2; 
                    fcmSaveData.historicoSavesProcessados.push(assinaturaUnicaDoArquivo);
                    fcmSaveData.tickets += creditosGanhos; salvarProgressoAutomatico(); atualizarInterfaceCarteira();
                    alert("🎮 PROGRESSO EXTRAÍDO! +" + creditosGanhos + " Tickets!");
                };
                reader.readAsText(arquivoEscolhido, "ISO-8859-1");
            });

            document.getElementById('btn-validar-codigo').addEventListener('click', function() {
                let campo = document.getElementById('input-codigo-fcm'); let cod = campo.value.trim().toUpperCase(); if (!cod) return;
                if (cod === "TESTE100") { fcmSaveData.tickets += 1; campo.value = ""; salvarProgressoAutomatico(); atualizarInterfaceCarteira(); alert("🎟️ Teste Ativo!"); return; }
                if (fcmSaveData.codigosUsados.includes(cod)) { alert("Cupom já utilizado!"); return; }
                let partes = cod.split("-");
                if (partes.length === 5 && partes[0] === "FCM26" && partes[1] === "SLP") {
                    if (verificarAssinaturaCupom(partes[2] + partes[3], partes[4])) {
                        let creditosGanhos = parseInt(partes[3]) - 17;
                        if (creditosGanhos > 0) {
                            fcmSaveData.codigosUsados.push(cod); fcmSaveData.tickets += creditosGanhos; campo.value = "";
                            salvarProgressoAutomatico(); atualizarInterfaceCarteira(); alert(`🎟️ +${creditosGanhos} Tickets!`);
                        }
                    } else { alert("❌ Cupom inválido."); }
                }
            });

            document.getElementById('btn-abrir-pacote').addEventListener('click', () => {
                if(fcmSaveData.pacotes <= 0) return; fcmSaveData.pacotes--;
                let poolTotalFallback = Object.keys(bancoMestreJogadores); let figurinhasSorteadas = [];
                while(figurinhasSorteadas.length < 6) {
                    let d = Math.floor(Math.random() * 100) + 1; let id = null;
                    if (d <= 5 && poolRaros.length > 0) id = poolRaros[Math.floor(Math.random() * poolRaros.length)];
                    else if (d <= 30 && poolMedios.length > 0) id = poolMedios[Math.floor(Math.random() * poolMedios.length)];
                    else if (poolNormais.length > 0) id = poolNormais[Math.floor(Math.random() * poolNormais.length)];
                    else id = poolTotalFallback[Math.floor(Math.random() * poolTotalFallback.length)];
                    if (id && !figurinhasSorteadas.includes(id)) figurinhasSorteadas.push(id);
                }
                figurinhasSorteadas.forEach(id => {
                    let parsedId = parseInt(id);
                    if (fcmSaveData.colados[parsedId] || fcmSaveData.disponiveis.map(x=>parseInt(x)).includes(parsedId)) {
                        fcmSaveData.repetidas.push(parsedId);
                    } else {
                        fcmSaveData.disponiveis.push(parsedId);
                    }
                });
                salvarProgressoAutomatico(); atualizarInterfaceCarteira(); gaveta.classList.add('aberta');
            });

            // =====================================================================
            // 🚨 ENGINE DE COLAGEM FÍSICA CORRIGIDA (GRAFIA RESTAURADA)
            // =====================================================================
            document.getElementById('btn-colar-tudo').addEventListener('click', () => {
                let disponiveis = fcmSaveData.disponiveis; 
                let coladas = 0; 
                let novasRestantes = [];
                let listaCarteiraElement = document.querySelector('.carteira-lista');

                disponiveis.forEach(playerid => {
                    let infoSlot = mapeamentoSlots[playerid];
                    if (infoSlot) {
                        let divSlotReal = document.getElementById(`slot-album-${infoSlot.numSlot}`);
                        
                        // 🧠 AVALIAÇÃO DO SLOT FÍSICO REAL DO ÁLBUM
                        if (divSlotReal && !divSlotReal.classList.contains('card-instalado')) {
                            let classeMoldura = (infoSlot.divisao === "Brasileirão") ? "moldura-serie-a" : "moldura-serie-b";
                            let j = bancoMestreJogadores[playerid];
                            divSlotReal.className = `slot card-instalado ${classeMoldura}`; 
                            divSlotReal.setAttribute("data-playerid", playerid);
                            divSlotReal.innerHTML = gerarHtmlCardMontado(j); 
                            
                            fcmSaveData.colados[playerid] = true; 
                            coladas++;
                        } 
                        else {
                            fcmSaveData.repetidas.push(playerid);
                        }
                    } else { 
                        novasRestantes.push(playerid); 
                    }
                });

                fcmSaveData.disponiveis = novasRestantes; 
                salvarProgressoAutomatico(); 
                
                if (listaCarteiraElement) listaCarteiraElement.innerHTML = "";
                atualizarInterfaceCarteira(); 
                vincularClickZoomSlotsColados();
                
                gaveta.classList.remove('aberta');
                if (coladas > 0) { 
                    alert(`⚽ SUCESSO!\n\nVocê colou ${coladas} novas figurinhas no seu Álbum!\nOs cards duplicados restantes foram movidos instantaneamente para a sua aba de Repetidas!`); 
                } else {
                    alert(`🔄 ORGANIZAÇÃO CONCLUÍDA!\n\nTodos os cards da aba disponíveis já estavam colados e foram movidos para as suas Repetidas de troca!`);
                }
            });

            document.getElementById('btn-export-save').addEventListener('click', () => {
                let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fcmSaveData));
                let dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", "backup_album.fcm"); dlAnchorElem.click();
            });

            document.getElementById('btn-import-save').addEventListener('click', () => { document.getElementById('file-uploader-save').click(); });
            document.getElementById('file-uploader-save').addEventListener('change', function(e) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        let importData = JSON.parse(event.target.result);
                        if (importData.colados) {
                            fcmSaveData = importData; localStorage.setItem('fcm_album_savegame', JSON.stringify(fcmSaveData));
                            window.location.reload();
                        }
                    } catch(err) { alert("Save inválido!"); }
                };
                if(e.target.files[0]) reader.readAsText(e.target.files[0]);
            });

            document.getElementById('aba-novas').addEventListener('click', (e) => { document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa')); e.target.classList.add('ativa'); abaAtiva = "disponiveis"; atualizarInterfaceCarteira(); });
            document.getElementById('aba-repetidas').addEventListener('click', (e) => { document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa')); e.target.classList.add('ativa'); abaAtiva = "repetidas"; atualizarInterfaceCarteira(); });
            document.getElementById('aba-quiz').addEventListener('click', (e) => { document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa')); e.target.classList.add('ativa'); abaAtiva = "quiz"; atualizarInterfaceCarteira(); });
            document.getElementById('btn-fullscreen').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });
            
            document.getElementById('btn-inicio').addEventListener('click', () => { pageFlip.flip(0); });
            document.getElementById('btn-serie-a').addEventListener('click', () => { pageFlip.flip(paginaSerieA); });
            document.getElementById('btn-serie-b').addEventListener('click', () => { pageFlip.flip(paginaSerieB); });
            document.getElementById('btn-fim').addEventListener('click', () => { pageFlip.flip(pageFlip.getPageCount() - 1); });

            salvarProgressoAutomatico(); atualizarInterfaceCarteira(); vincularClickZoomSlotsColados();
        });
    </script>
</body>
</html>
